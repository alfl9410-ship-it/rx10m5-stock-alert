name: RX10M5 stock monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions는 정확히 5분마다 실행된다고 보장하지 않습니다.
    # 지연이 생길 수 있으므로 '근접 실시간' 모니터링입니다.
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run monitor
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          PRODUCT_NAME: DSC-RX10M5
          PRODUCT_NAME_ALT: RX10 V
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save status
        run: |
          git config user.name "rx10m5-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add last_status.txt
          git diff --cached --quiet || git commit -m "Update RX10M5 stock status"
          git push
